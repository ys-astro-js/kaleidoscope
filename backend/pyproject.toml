[project]
name = "music-embedding-test-backend"
version = "0.1.0"
description = "Local OpenMuQ/MuQ-MuLan music embedding similarity prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "muq>=0.1.0",
  "torch==2.11.0+cu128",
  "torchaudio==2.11.0+cu128",
  "torchvision==0.26.0+cu128",
  "librosa>=0.10.2",
  "mutagen>=1.47.0",
  "lancedb>=0.13.0",
  "umap-learn>=0.5.6",
  "numpy>=1.26.0",
  "pillow>=10.4.0",
  "pyarrow>=16.0.0",
  "imageio-ffmpeg>=0.5.1",
  "audio-separator>=0.35.0",
  "huggingface-hub>=0.30.0",
  "onnxruntime-gpu>=1.22.0",
  "einops>=0.8.0",
  "lightning>=2.3.0,<3.0.0",
  "nnAudio>=0.3.3",
  "omegaconf>=2.3.0,<3.0.0",
  "soundfile>=0.12.1",
  "soxr>=0.5.0",
  "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
